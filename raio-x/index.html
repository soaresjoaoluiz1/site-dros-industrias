<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DROS Sales · Raio-X Comercial da Indústria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#0a0e15; --bg2:#0f1622; --card:#141c2a; --line:#202c3e;
    --gold:#f5b50a; --gold2:#ffce4d; --white:#f3f6fb; --mut:#8593a8; --mut2:#5d6a7e;
    --green:#34c98a; --red:#e8604c; --amber:#f3a826; --blue:#5b9cf0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--white);min-height:100vh}
  .wrap{max-width:880px;margin:0 auto;padding:0 20px}
  header{display:flex;justify-content:space-between;align-items:center;padding:24px 0 8px}
  .logo{display:flex;align-items:center;gap:10px}
  .logo-mark{width:34px;height:34px;border-radius:9px;background:var(--gold);color:#000;font-weight:800;display:grid;place-items:center;font-size:15px}
  .fade{animation:f .45s ease both}
  @keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .bar{transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .btn{transition:transform .14s,box-shadow .2s,background .2s,border-color .2s;cursor:pointer}
  .btn:hover{transform:translateY(-2px)}
  .opt:hover{border-color:var(--gold)!important;background:var(--bg2)!important}
  .num:hover{transform:scale(1.07)}
  input.inp{background:var(--bg2);border:1px solid var(--line);color:var(--white);border-radius:12px;padding:16px;font-size:20px;font-weight:700;width:100%;outline:none;font-family:inherit}
  input.inp:focus{border-color:var(--gold)}
  footer{text-align:center;color:var(--mut2);font-size:12px;padding:44px 0 28px;border-top:1px solid var(--line);margin-top:50px}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.twocol{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<script type="text/babel">
const {useState, useMemo, useRef, useEffect} = React;
const e = React.createElement;

// ======= CONFIG QUE VOCÊ PODE TROCAR =======
const CONTATO = {
  ctaLink: "/industria/diagnostico.html?from=raio-x",
  precoBase: 5000,
  verbaAnuncio: 1500,
};

const C = {
  bg:"#0a0e15", bg2:"#0f1622", card:"#141c2a", line:"#202c3e",
  gold:"#f5b50a", gold2:"#ffce4d", white:"#f3f6fb", mut:"#8593a8", mut2:"#5d6a7e",
  green:"#34c98a", red:"#e8604c", amber:"#f3a826", blue:"#5b9cf0",
};

const BENCH = { investPctIdeal:8, investPctMin:5, novosIdealPct:4, dependenciaMax:30, indicacaoMax:50, followupIdeal:70 };

const FAT_FAIXAS = [
  {label:"Até R$ 50 mil/mês", v:35000},
  {label:"R$ 50 mil a R$ 150 mil", v:100000},
  {label:"R$ 150 mil a R$ 500 mil", v:325000},
  {label:"R$ 500 mil a R$ 1 milhão", v:750000},
  {label:"R$ 1 mi a R$ 3 mi", v:2000000},
  {label:"Acima de R$ 3 milhões", v:4000000},
];
const SETORES = ["Embalagens / Papel","Químico","Alimentos / Bebidas","Metalúrgica","Plásticos","Cosméticos","Vidraçaria / Vidros","Automotivo / Autopeças","Outro segmento industrial"];

const NAOSEI = "__NS__";

const STEPS = [
  {block:"Sua empresa", id:"setor", type:"select", q:"Qual o segmento da sua indústria?", help:"Pra comparar você com empresas parecidas.", options:SETORES},
  {block:"Sua empresa", id:"tempo", type:"faixa", q:"Há quanto tempo a empresa existe?", help:"", canNS:false, options:[{label:"Menos de 2 anos",v:1},{label:"2 a 5 anos",v:3},{label:"5 a 10 anos",v:7},{label:"Mais de 10 anos",v:12}]},
  {block:"Sua empresa", id:"entrega", type:"faixa", q:"Você tem entrega própria?", help:"Logística costuma ser um argumento de venda forte.", canNS:false, options:[{label:"Sim, frota própria",v:2},{label:"Terceirizo",v:1},{label:"Não entrego",v:0}]},
  {block:"Sua empresa", id:"redes", type:"multi", q:"Tem redes sociais? Quais usa hoje?", help:"Marque todas. Se não tiver, marque a última.", options:["Instagram","Facebook","LinkedIn","TikTok","WhatsApp Business","Não tenho / parado"]},
  {block:"Sua experiência digital", id:"jatentou", type:"faixa", q:"Você já tentou o digital pra vender antes?", help:"Sem julgamento — só pra entender de onde você parte.", canNS:false, options:[{label:"Nunca tentei",v:0},{label:"Tenho, mas está parado",v:1},{label:"Tentei e parei",v:2},{label:"Faço hoje",v:3}]},
  {block:"Sua experiência digital", id:"dificuldade", type:"faixa", q:"Qual foi a maior dificuldade quando tentou?", help:"O que mais te travou.", showIf:(a)=>a.jatentou===1||a.jatentou===2||a.jatentou===3, canNS:false, options:[{label:"Não veio cliente nenhum",v:1},{label:"Veio cliente errado",v:2},{label:"Não soube medir o resultado",v:3},{label:"Faltou tempo / equipe",v:4},{label:"Gastei e não tive retorno",v:5}]},
  {block:"Seus números", id:"fatFaixa", type:"faixa", q:"Quanto a empresa fatura por mês, em média?", help:"Escolha a faixa mais próxima. Fica entre a gente.", options:FAT_FAIXAS},
  {block:"Seus números", id:"ticket", type:"numero", q:"Qual o valor médio de um pedido (ticket médio)?", help:"Se não souber exato, estime — ou marque 'não sei dizer'.", prefix:"R$", placeholder:"ex: 2500"},
  {block:"Seus números", id:"clientesAtivos", type:"numero", q:"Quantos clientes ativos você tem hoje?", help:"Clientes que compraram nos últimos meses.", placeholder:"ex: 80"},
  {block:"Seus números", id:"novosMes", type:"numero", q:"Quantos clientes NOVOS entram, em média, por mês?", help:"Que nunca tinham comprado. Pode ser 0.", placeholder:"ex: 3"},
  {block:"Dinheiro e dependência", id:"topClientesPct", type:"faixa", q:"Quanto do faturamento vem dos seus 5 maiores clientes?", help:"Aquele 'se esse sai, complica' — o quanto pesa?", options:[{label:"Menos de 20%",v:15},{label:"20% a 40%",v:30},{label:"40% a 60%",v:50},{label:"Mais de 60%",v:70}]},
  {block:"Dinheiro e dependência", id:"indicacaoPct", type:"faixa", q:"Dos clientes novos, quanto vem de indicação?", help:"Indicação é ótima — mas depender só dela tira previsibilidade.", options:[{label:"Menos de 30%",v:20},{label:"30% a 60%",v:45},{label:"60% a 90%",v:75},{label:"Quase tudo",v:95}]},
  {block:"Dinheiro e dependência", id:"investe", type:"faixa", q:"Quanto investe por mês pra atrair clientes novos?", help:"Anúncios, comercial ativo, prospecção.", options:[{label:"Praticamente nada",v:0},{label:"Até R$ 1 mil",v:800},{label:"R$ 1 mil a R$ 5 mil",v:3000},{label:"R$ 5 mil a R$ 15 mil",v:9000},{label:"Mais de R$ 15 mil",v:20000}]},
  {block:"Como você vende hoje", id:"canais", type:"multi", q:"Como sua empresa traz clientes hoje?", help:"Marque tudo que realmente traz pedido.", noNS:true, options:["Indicação / boca a boca","Representante comercial","Vendedor externo","Clientes antigos recomprando","Anúncios (Meta / Google)","Instagram / redes sociais","Site / busca no Google","Feiras e eventos","Prospecção ativa (WhatsApp/ligação)"]},
  {block:"Como você vende hoje", id:"crm", type:"escala", q:"Você sabe em que pé está cada negociação aberta?", help:"0 = está tudo na cabeça/caderno · 10 = controlo num sistema", area:"gestao"},
  {block:"Como você vende hoje", id:"followup", type:"faixa", q:"Quem pede orçamento e não fecha na hora, recebe retorno?", help:"O famoso 'ficou de ver e sumiu'.", options:[{label:"Quase nunca",v:10},{label:"Às vezes, sem padrão",v:40},{label:"Na maioria das vezes",v:70},{label:"Sempre, é processo",v:95}]},
  {block:"Como você vende hoje", id:"conversao", type:"faixa", q:"De cada 10 orçamentos, quantos viram pedido?", help:"Sua taxa de fechamento, mais ou menos.", options:[{label:"Menos de 1",v:8},{label:"2 a 3",v:25},{label:"4 a 5",v:45},{label:"6 ou mais",v:65}]},
  {block:"Maturidade comercial", id:"prev1", type:"escala", q:"No começo do mês, você prevê quanto vai vender?", help:"0 = é sempre surpresa · 10 = previsão confiável", area:"prev"},
  {block:"Maturidade comercial", id:"novos1", type:"escala", q:"Consegue abrir uma região nova quando decide?", help:"0 = não sei por onde começar · 10 = tenho método", area:"novos"},
  {block:"Maturidade comercial", id:"proc1", type:"escala", q:"Existe um processo igual do contato ao pedido?", help:"0 = cada venda é de um jeito · 10 = processo seguido", area:"proc"},
  {block:"Maturidade comercial", id:"digital1", type:"escala", q:"O digital te traz pedido de verdade?", help:"0 = perfil parado · 10 = gera pedido real", area:"digital"},
  {block:"Maturidade comercial", id:"cresce1", type:"escala", q:"A empresa cresce constante ou vive de altos e baixos?", help:"0 = montanha-russa · 10 = crescimento constante", area:"prev"},
];

const AREAS = { prev:"Previsibilidade comercial", novos:"Entrada de novos clientes", proc:"Processo comercial", digital:"Digital como canal de vendas", gestao:"Gestão e acompanhamento" };

function avg(arr){const v=arr.filter(x=>!isNaN(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:0;}
function scaleFn(val,from,to){if(to===from)return 5;const t=(val-from)/(to-from);return Math.max(0,Math.min(10,t*10));}
function lvl(s){return s<4?"baixo":s<7?"medio":"alto";}
function brl(n){if(!isFinite(n))return"—";return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});}
function isNum(v){return v!==undefined&&v!==null&&v!==""&&v!==NAOSEI&&!isNaN(Number(v));}
function val(a,id){const v=a[id];return v===NAOSEI||v===undefined?null:v;}

function analyze(a){
  const fat=val(a,"fatFaixa")||0;
  const ticket=isNum(a.ticket)?Number(a.ticket):0;
  const clientes=isNum(a.clientesAtivos)?Number(a.clientesAtivos):0;
  const novosMes=isNum(a.novosMes)?Number(a.novosMes):0;
  const top=val(a,"topClientesPct");
  const indic=val(a,"indicacaoPct");
  const investe=val(a,"investe");
  const followup=val(a,"followup");
  const conv=val(a,"conversao");
  const canais=a.canais||[];

  const chaves=["ticket","clientesAtivos","novosMes","topClientesPct","indicacaoPct","investe","followup","conversao"];
  let naoSabe=0;
  chaves.forEach(k=>{const v=a[k];if(v===NAOSEI||v===undefined||v===""){naoSabe++;}});
  const controleScore=Math.max(0,10-(naoSabe/chaves.length)*10);

  const investPct=(fat>0&&investe!=null)?(investe/fat)*100:null;
  const entradaPct=clientes>0?(novosMes/clientes)*100:null;
  const canaisProprios=canais.filter(c=>["Anúncios (Meta / Google)","Site / busca no Google","Prospecção ativa (WhatsApp/ligação)","Instagram / redes sociais"].includes(c)).length;

  const esc=id=>a[id]!=null&&a[id]!==NAOSEI?a[id]:5;
  const areaScores={
    prev: avg([esc("prev1"),esc("cresce1"),top!=null?scaleFn(top,70,15):NaN,indic!=null?scaleFn(indic,95,20):NaN]),
    novos: avg([esc("novos1"),entradaPct!=null?scaleFn(entradaPct,0,5):NaN,scaleFn(canaisProprios,0,3)]),
    proc: avg([esc("proc1"),conv!=null?scaleFn(conv,8,65):NaN,followup!=null?scaleFn(followup,10,95):NaN]),
    digital: avg([esc("digital1"),scaleFn(canaisProprios,0,4)]),
    gestao: avg([esc("crm"),followup!=null?scaleFn(followup,10,95):NaN]),
  };
  const overall=avg(Object.values(areaScores));

  const benchmarks=[];
  if(investPct!=null) benchmarks.push({k:"Investimento em captação",you:investPct.toFixed(1)+"% do faturamento",market:BENCH.investPctMin+"–"+BENCH.investPctIdeal+"% (indústria B2B)",status:investPct>=BENCH.investPctMin?(investPct>=BENCH.investPctIdeal?"ok":"warn"):"bad",note:investPct<BENCH.investPctMin?"Abaixo do mínimo que indústrias que crescem praticam.":investPct<BENCH.investPctIdeal?"Investe, mas ainda abaixo de quem escala.":"Em linha com quem cresce de forma consistente."});
  if(top!=null) benchmarks.push({k:"Dependência dos maiores clientes",you:top+"% nos 5 maiores",market:"ideal abaixo de "+BENCH.dependenciaMax+"%",status:top<=BENCH.dependenciaMax?"ok":top<=50?"warn":"bad",note:top>50?"Risco alto: se um cliente grande sai, o mês quebra.":top>BENCH.dependenciaMax?"Concentração acima do saudável.":"Base bem distribuída."});
  if(indic!=null) benchmarks.push({k:"Dependência de indicação",you:indic+"% dos novos",market:"ideal abaixo de "+BENCH.indicacaoMax+"%",status:indic<=BENCH.indicacaoMax?"ok":indic<=75?"warn":"bad",note:indic>75?"Refém de indicação: não controla quando entra cliente.":indic>BENCH.indicacaoMax?"Indicação manda demais — falta canal próprio.":"Não depende só de indicação. Bom sinal."});
  if(entradaPct!=null) benchmarks.push({k:"Entrada de clientes novos",you:entradaPct.toFixed(1)+"% da base/mês",market:"~"+BENCH.novosIdealPct+"% ao mês",status:entradaPct>=4?"ok":entradaPct>=2?"warn":"bad",note:entradaPct<2?"Entrada muito baixa — a base não renova.":entradaPct<4?"Entra devagar pro tamanho da operação.":"Boa renovação da base."});
  if(followup!=null) benchmarks.push({k:"Acompanhamento de quem não fechou",you:followup+"% recebem retorno",market:"ideal acima de "+BENCH.followupIdeal+"%",status:followup>=BENCH.followupIdeal?"ok":followup>=40?"warn":"bad",note:followup<40?"Perde venda que já estava na mão.":followup<BENCH.followupIdeal?"Follow-up sem padrão — escapa venda.":"Quase todo contato é trabalhado."});

  const novosAlvo=Math.max(novosMes,Math.ceil((clientes||0)*0.04));
  const ganhoNovos=Math.max(0,novosAlvo-novosMes);
  const convAtual=conv!=null?conv:20;
  const convAlvo=Math.min(convAtual+10,50);
  const upliftConv=convAtual>0?(convAlvo-convAtual)/convAtual:0;
  const receitaNovos=ganhoNovos*ticket;
  const fatBase=fat||clientes*ticket;
  const ganhoConv=fatBase*upliftConv*0.3;
  const ganhoFollow=(followup!=null&&followup<BENCH.followupIdeal)?fatBase*0.05:0;
  const ganhoMensal=receitaNovos+ganhoConv+ganhoFollow;

  const ranked=Object.keys(areaScores).map(k=>({key:k,name:AREAS[k],score:areaScores[k]})).sort((x,y)=>x.score-y.score);

  return {overall,areaScores,ranked,benchmarks,controleScore,naoSabe,totalChaves:chaves.length,
    proj:{ganhoMensal,ganhoAnual:ganhoMensal*12,ganhoNovos,novosAlvo,convAtual,convAlvo,receitaNovos,ganhoConv,ganhoFollow,ticket,hasData:ticket>0&&(clientes>0||fat>0)}};
}

const PLANO={
  prev:{baixo:"Diluir a dependência de poucos clientes e criar entrada constante de demanda.",medio:"Equilibrar a carteira e instalar meta mensal por canal pra prever o mês.",alto:"Usar a previsão pra planejar crescimento por região/segmento."},
  novos:{baixo:"Criar um canal próprio que traz cliente novo todo mês (anúncio + comercial ativo).",medio:"Estruturar geração de demanda mirando o comprador certo, na região certa.",alto:"Escalar a aquisição abrindo novas regiões com método replicável."},
  proc:{baixo:"Definir um processo único do contato ao pedido — pra venda não depender da pessoa.",medio:"Padronizar atendimento e implantar follow-up de quem não fechou.",alto:"Otimizar etapas e subir a conversão com ajustes finos."},
  digital:{baixo:"Transformar o digital de perfil parado em canal que gera pedido.",medio:"Conectar posicionamento e anúncios ao comercial, mirando quem compra.",alto:"Integrar dados de campanha ao CRM pra investir só no que vira pedido."},
  gestao:{baixo:"Implantar um CRM simples pra enxergar cada negociação e parar de perder venda.",medio:"Acompanhar indicadores em tempo real e cobrar etapas do funil.",alto:"Usar os dados pra decidir crescimento com segurança."},
};

function App(){
  const [stage,setStage]=useState("intro");
  const [answers,setAnswers]=useState({});
  const [i,setI]=useState(0);
  const top=useRef(null);

  const visible=useMemo(()=>STEPS.filter(s=>!s.showIf||s.showIf(answers)),[answers]);
  const total=visible.length;
  const step=visible[i];

  useEffect(()=>{if(top.current)top.current.scrollIntoView({behavior:"smooth",block:"start"});},[stage,i]);
  const set=(id,v)=>setAnswers(a=>({...a,[id]:v}));

  const answered=(()=>{
    if(!step)return false;
    const v=answers[step.id];
    if(step.type==="multi")return Array.isArray(v)&&v.length>0;
    if(step.type==="numero")return v===NAOSEI||isNum(v);
    return v!==undefined&&v!==null;
  })();

  const result=useMemo(()=>analyze(answers),[answers]);

  return e("div",{ref:top,style:{minHeight:"100vh"}},
    e("div",{className:"wrap"},
      e("header",null,
        e("div",{className:"logo"},
          e("div",{className:"logo-mark"},"D"),
          e("span",{style:{fontWeight:800,fontSize:15}},"DROS ",e("span",{style:{color:C.mut,fontWeight:600}},"SALES"))
        ),
        e("span",{style:{fontSize:12,color:C.mut,fontWeight:600}},"Raio-X Comercial · Gratuito")
      ),
      stage==="intro"&&e(Intro,{total,onStart:()=>{setI(0);setStage("quiz");}}),
      stage==="quiz"&&e(Quiz,{step,i,total,value:answers[step.id],answered,
        onSet:v=>set(step.id,v),
        onNext:()=>{i<total-1?setI(i+1):setStage("result");},
        onPrev:()=>i>0&&setI(i-1)}),
      stage==="result"&&e(Result,{r:result,a:answers,onRestart:()=>{setAnswers({});setI(0);setStage("intro");}}),
      e("footer",null,"DROS Sales · Canal de vendas para indústria vender mais. · Diagnóstico gratuito e sem compromisso.")
    )
  );
}

function Intro({total,onStart}){
  const blocks=[["Seus números","Faturamento, ticket, clientes e novos."],["Sua dependência","Quanto pesa indicação e os maiores clientes."],["Seus canais","Como você traz cliente e o que dá pedido."],["Sua maturidade","Previsibilidade, processo e gestão."]];
  return e("section",{className:"fade",style:{padding:"38px 0 10px"}},
    e("span",{style:{fontSize:12,fontWeight:700,letterSpacing:2,color:C.gold,textTransform:"uppercase"}},"Raio-X comercial da indústria"),
    e("h1",{style:{fontSize:"clamp(34px,6vw,56px)",lineHeight:1.04,fontWeight:800,letterSpacing:-1,margin:"16px 0 18px"}},"Sua empresa cresce",e("br"),"ou só ",e("span",{style:{color:C.gold}},"trabalha mais?")),
    e("p",{style:{fontSize:"clamp(16px,2.4vw,19px)",color:C.mut,maxWidth:640,lineHeight:1.55,margin:"0 0 12px"}},"Responda perguntas simples sobre o dia a dia da sua operação e receba um diagnóstico real: como você está ",e("b",{style:{color:C.white}},"comparado à média do setor"),", onde está travando e ",e("b",{style:{color:C.white}},"quanto dá pra destravar")," em faturamento."),
    e("p",{style:{fontSize:14,color:C.mut2,margin:"0 0 30px"}},"Não sabe algum número? Sem problema — tem a opção \"não sei dizer\", e isso também faz parte da análise."),
    e("button",{onClick:onStart,className:"btn",style:{background:C.gold,color:"#000",border:"none",borderRadius:12,padding:"16px 30px",fontSize:16,fontWeight:800,boxShadow:"0 12px 30px -8px "+C.gold+"66"}},"Começar meu raio-X →"),
    e("p",{style:{fontSize:13,color:C.mut2,marginTop:14}},"~3 minutos · seus dados ficam entre você e a DROS"),
    e("div",{style:{marginTop:42,display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:12}},
      blocks.map((b,k)=>e("div",{key:k,style:{background:C.card,border:"1px solid "+C.line,borderRadius:16,padding:20}},
        e("div",{style:{color:C.gold,fontWeight:800,fontSize:13,marginBottom:8}},String(k+1).padStart(2,"0")),
        e("div",{style:{fontWeight:700,fontSize:16,marginBottom:6}},b[0]),
        e("div",{style:{color:C.mut,fontSize:13.5,lineHeight:1.5}},b[1])
      ))
    )
  );
}

function Quiz({step,i,total,value,answered,onSet,onNext,onPrev}){
  const canNS=step.canNS!==false&&!step.noNS&&step.type!=="select"&&step.type!=="multi";
  return e("section",{className:"fade",key:step.id,style:{padding:"18px 0 10px"}},
    e("div",{style:{display:"flex",alignItems:"center",gap:14,marginBottom:26}},
      e("div",{style:{flex:1,height:8,background:C.card,borderRadius:8,overflow:"hidden"}},
        e("div",{className:"bar",style:{width:(i/total*100)+"%",height:"100%",background:"linear-gradient(90deg,"+C.gold+","+C.gold2+")"}})),
      e("span",{style:{fontSize:13,color:C.mut,fontWeight:700,whiteSpace:"nowrap"}},(i+1)+"/"+total)
    ),
    e("span",{style:{fontSize:12,fontWeight:700,letterSpacing:1.5,color:C.gold,textTransform:"uppercase"}},step.block),
    e("h2",{style:{fontSize:"clamp(22px,3.8vw,30px)",lineHeight:1.22,fontWeight:800,letterSpacing:-0.5,margin:"12px 0 8px"}},step.q),
    step.help&&e("p",{style:{color:C.mut,fontSize:14,margin:"0 0 30px",lineHeight:1.5}},step.help),
    step.type==="escala"&&e(Escala,{value,onSet}),
    (step.type==="faixa"||step.type==="select")&&e(Opcoes,{options:step.options,value,type:step.type,onSet}),
    step.type==="numero"&&e(Numero,{step,value,onSet}),
    step.type==="multi"&&e(Multi,{options:step.options,value,onSet}),
