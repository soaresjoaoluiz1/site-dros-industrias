<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  .slide { width: 1080px; height: 1350px; position: relative; background: #EDE5D1; overflow: hidden; }
  .paper-texture { position: absolute; inset: 0; opacity: 0.55; mix-blend-mode: multiply; pointer-events: none; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(70, 50, 20, 0.18) 100%); pointer-events: none; }
  .top-rule, .bottom-rule { position: absolute; left: 80px; right: 80px; height: 1px; background: #1A1611; opacity: 0.4; }
  .top-rule { top: 60px; } .bottom-rule { bottom: 60px; }
  .kicker { position: absolute; top: 80px; left: 80px; right: 80px; display: flex; justify-content: space-between; font-size: 14px; letter-spacing: 4px; text-transform: uppercase; color: #1A1611; font-weight: 600; }
  .pagenum { position: absolute; top: 80px; right: 80px; font-family: 'Cormorant Garamond', serif; font-size: 22px; color: #6B2A2A; }
  .content { position: absolute; left: 80px; right: 80px; top: 200px; }
  .section-label { font-family: 'Inter', sans-serif; font-size: 13px; letter-spacing: 5px; text-transform: uppercase; color: #6B2A2A; font-weight: 700; margin-bottom: 30px; }
  .headline { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 130px; line-height: 0.95; color: #1A1611; letter-spacing: -2px; }
  .headline em { font-style: italic; color: #6B2A2A; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-top: 90px; padding-top: 50px; border-top: 1px solid rgba(26, 22, 17, 0.3); }
  .stat-num { font-family: 'Cormorant Garamond', serif; font-size: 120px; line-height: 1; color: #1A1611; font-weight: 500; letter-spacing: -3px; }
  .stat-num sup { font-size: 50px; }
  .stat-label { font-family: 'Inter', sans-serif; font-size: 18px; line-height: 1.4; color: #3A3026; margin-top: 16px; font-weight: 400; }
  .source { position: absolute; bottom: 200px; left: 80px; right: 80px; font-family: 'Inter', sans-serif; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: #6B2A2A; font-weight: 600; }
  .twist { position: absolute; bottom: 120px; left: 80px; right: 80px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 36px; color: #1A1611; }
  .twist strong { color: #6B2A2A; font-weight: 600; font-style: normal; text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="slide">
    <svg class="paper-texture" xmlns="http://www.w3.org/2000/svg">
      <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 0.6 0"/></filter>
      <rect width="100%" height="100%" filter="url(#n)"/>
    </svg>
    <div class="vignette"></div>
    <div class="top-rule"></div>
    <div class="bottom-rule"></div>

    <div class="kicker">
      <span>DROS · INDÚSTRIA</span>
      <span>I. CONTEXTO</span>
    </div>

    <div class="content">
      <div class="section-label">— O peso real</div>
      <h1 class="headline">A indústria<br><em>move o Brasil.</em></h1>

      <div class="stats">
        <div>
          <div class="stat-num">23,4<sup>%</sup></div>
          <div class="stat-label">do PIB brasileiro vem do setor industrial</div>
        </div>
        <div>
          <div class="stat-num">35,2<sup>%</sup></div>
          <div class="stat-label">de toda a arrecadação federal sai daqui</div>
        </div>
      </div>
    </div>

    <div class="source">Fonte: CNI · 2025</div>
    <div class="twist">E mesmo assim, <strong>ainda vende por sorte.</strong></div>
  </div>
</body>
</html>
