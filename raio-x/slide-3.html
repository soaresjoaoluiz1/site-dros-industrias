<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  .slide { width: 1080px; height: 1350px; position: relative; background: #EDE5D1; overflow: hidden; }
  .paper-texture { position: absolute; inset: 0; opacity: 0.55; mix-blend-mode: multiply; pointer-events: none; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(70, 50, 20, 0.18) 100%); pointer-events: none; }
  .top-rule, .bottom-rule { position: absolute; left: 80px; right: 80px; height: 1px; background: #1A1611; opacity: 0.4; }
  .top-rule { top: 60px; } .bottom-rule { bottom: 60px; }
  .kicker { position: absolute; top: 80px; left: 80px; right: 80px; display: flex; justify-content: space-between; font-size: 14px; letter-spacing: 4px; text-transform: uppercase; color: #1A1611; font-weight: 600; }
  .content { position: absolute; left: 80px; right: 80px; top: 50%; transform: translateY(-50%); }
  .label { font-family: 'Inter', sans-serif; font-size: 13px; letter-spacing: 5px; text-transform: uppercase; color: #6B2A2A; font-weight: 700; margin-bottom: 40px; }
  .line-1 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 132px; line-height: 1.0; color: #1A1611; letter-spacing: -2px; }
  .divider { width: 100px; height: 2px; background: #6B2A2A; margin: 50px 0; }
  .line-2 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: 96px; line-height: 1.05; color: #6B2A2A; letter-spacing: -1px; }
  .footer-meta { position: absolute; bottom: 80px; left: 80px; right: 80px; display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 4px; text-transform: uppercase; color: #1A1611; font-weight: 600; }
</style>
</head>
<body>
  <div class="slide">
    <svg class="paper-texture" xmlns="http://www.w3.org/2000/svg">
      <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 0.6 0"/></filter>
      <rect width="100%" height="100%" filter="url(#n)"/>
    </svg>
    <div class="vignette"></div>
    <div class="top-rule"></div>
    <div class="bottom-rule"></div>

    <div class="kicker">
      <span>DROS · INDÚSTRIA</span>
      <span>II. DIAGNÓSTICO</span>
    </div>

    <div class="content">
      <div class="label">— O verdadeiro problema</div>
      <h1 class="line-1">O produto<br>é bom.</h1>
      <div class="divider"></div>
      <h2 class="line-2">O problema está no caminho<br>até o cliente.</h2>
    </div>

    <div class="footer-meta">
      <span>drosagencia.com.br</span>
      <span>03 / 09</span>
    </div>
  </div>
</body>
</html>
